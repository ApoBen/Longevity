<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Longevity Platform</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js and Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    
    <!-- pdf.js (Mozilla) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/glassmorphism.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/charts.css">
    
    <!-- Page Specific Stylesheets (Dynamically loaded or included here) -->
    <link rel="stylesheet" href="css/pages/dashboard.css">
    <link rel="stylesheet" href="css/pages/timeline.css">
    <link rel="stylesheet" href="css/pages/medications.css">
    <link rel="stylesheet" href="css/pages/labs.css">
    <link rel="stylesheet" href="css/pages/workouts.css">
    <link rel="stylesheet" href="css/pages/trends.css">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- App Wrapper -->
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="app-header glass-header">
            <div class="logo-container">
                <span class="logo-icon">✨</span>
                <h1 class="logo-text">LONGEVITY</h1>
            </div>
            <div class="header-actions">
                <span id="sync-badge" class="badge badge-success">
                    <i data-lucide="check-circle" class="badge-icon"></i> Eşitlendi
                </span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Dynamic pages will be loaded here -->
            <div class="loading-spinner-container">
                <div class="spinner"></div>
                <p>Yükleniyor...</p>
            </div>
        </main>

        <!-- Bottom Navigation Bar (6 Tabs) -->
        <nav class="bottom-nav glass-nav">
            <a href="#/" class="nav-item active" id="nav-home">
                <i data-lucide="home" class="nav-icon"></i>
                <span class="nav-label">Ana Sayfa</span>
            </a>
            <a href="#/timeline" class="nav-item" id="nav-timeline">
                <i data-lucide="clock" class="nav-icon"></i>
                <span class="nav-label">Saatlik</span>
            </a>
            <a href="#/medications" class="nav-item" id="nav-meds">
                <i data-lucide="pill" class="nav-icon"></i>
                <span class="nav-label">İlaçlar</span>
            </a>
            <a href="#/labs" class="nav-item" id="nav-labs">
                <i data-lucide="test-tube-2" class="nav-icon"></i>
                <span class="nav-label">Tahliller</span>
            </a>
            <a href="#/workouts" class="nav-item" id="nav-workouts">
                <i data-lucide="dumbbell" class="nav-icon"></i>
                <span class="nav-label">İdman</span>
            </a>
            <a href="#/trends" class="nav-item" id="nav-trends">
                <i data-lucide="trending-up" class="nav-icon"></i>
                <span class="nav-label">Trendler</span>
            </a>
        </nav>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Global Application Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
